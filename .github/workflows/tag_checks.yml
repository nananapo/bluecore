name: Tag Constraints Check

on:
  push:
    branches:
      - book
  pull_request:
    branches:
      - book
  workflow_dispatch:

jobs:
  check-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tag check script
        run: |
          python3 .github/scripts/check_tags.py
